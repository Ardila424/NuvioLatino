name: Build Nuvio Latino release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to do with the build
        required: true
        type: choice
        default: build-only
        options:
          - build-only
          - draft-release
          - publish-release
      tag:
        description: 'Release tag, e.g. v1.0.0-latino.2 (required for draft/publish)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: nuvio-latino-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # TODO: replace debug signing with a real release keystore before a public stable.
      # Set these secrets and remove CI_USE_DEBUG_SIGNING below.
      NUVIO_RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
      NUVIO_RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
      NUVIO_RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
      NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
      LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure local.properties
        run: |
          if [ -n "${LOCAL_PROPERTIES_BASE64}" ]; then
            printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
          else
            printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > local.properties
          fi
          if [ -n "${NUVIO_RELEASE_KEYSTORE_BASE64}" ]; then
            printf '%s' "${NUVIO_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/nuviolatino.jks"
            {
              printf '\nNUVIO_RELEASE_STORE_FILE=%s\n' "${RUNNER_TEMP}/nuviolatino.jks"
              printf 'NUVIO_RELEASE_KEY_ALIAS=%s\n' "${NUVIO_RELEASE_KEY_ALIAS}"
              printf 'NUVIO_RELEASE_KEY_PASSWORD=%s\n' "${NUVIO_RELEASE_KEY_PASSWORD}"
              printf 'NUVIO_RELEASE_STORE_PASSWORD=%s\n' "${NUVIO_RELEASE_STORE_PASSWORD}"
            } >> local.properties
          fi

      - name: Unit tests
        run: ./gradlew :app:testFullDebugUnitTest

      - name: Build release APKs
        env:
          # Use debug signing until a real keystore is configured (see above).
          CI_USE_DEBUG_SIGNING: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 == '' && 'true' || 'false' }}
        run: ./gradlew :app:assembleFullRelease --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuviotv-${{ github.ref_name }}-full-release
          path: app/build/outputs/apk/full/release/*.apk
          if-no-files-found: error

      - name: Create GitHub release
        if: inputs.mode != 'build-only'
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ -z "${RELEASE_TAG}" ]; then
            echo "The 'tag' input is required for draft-release or publish-release." >&2
            exit 1
          fi
          {
            echo "## What's new"
            echo
            PREV_TAG="$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || true)"
            if [ -n "${PREV_TAG}" ]; then
              git log --no-merges --format='- %s' "${PREV_TAG}..HEAD"
            else
              git log --no-merges --format='- %s' -n 40 HEAD
            fi
          } > release-notes.md

          mapfile -t APKS < <(find app/build/outputs/apk/full/release -maxdepth 1 -type f -name '*.apk' -print | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "No release APKs produced." >&2
            exit 1
          fi

          TAG="${RELEASE_TAG}"
          if ! [[ "${TAG}" == v* ]]; then
            TAG="v${TAG}"
          fi

          ARGS=("${TAG}" --target "${{ github.sha }}" --title "Nuvio Latino ${TAG}" --notes-file release-notes.md)
          case "${RELEASE_MODE}" in
            publish-release)
              ARGS+=(--latest)
              ;;
            draft-release)
              ARGS+=(--draft)
              ;;
            *)
              ARGS+=(--draft --prerelease)
              ;;
          esac
          gh release create "${ARGS[@]}" "${APKS[@]}"
